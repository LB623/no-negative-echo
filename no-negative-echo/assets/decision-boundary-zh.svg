<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">最终交付信息的决策边界</title>
  <desc id="desc">三步判断：读者是否仍需要；省略是否会造成实质问题或是否属于真实基线变化；用户是否明确要求说明。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <style>
      .bg { fill: #101318; }
      .frame { fill: none; stroke: #303640; stroke-width: 1.5; }
      .card { fill: #191d23; stroke: #343a44; stroke-width: 1.5; }
      .card-active { stroke: #5a4430; }
      .title { fill: #f5f0e8; font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .subtitle { fill: #8f98a5; font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .question { fill: #f5f0e8; font: 650 25px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .hint { fill: #8f98a5; font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .step { fill: #101318; font: 800 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .chip { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; }
      .chip-keep { fill: #101318; }
      .chip-continue { fill: #ef8a35; }
      .chip-omit { fill: #a4acb7; }
      .footer { fill: #737d89; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="620" rx="28"/>
  <rect class="frame" x="18" y="18" width="1164" height="584" rx="22"/>

  <rect x="58" y="43" width="144" height="34" rx="17" fill="#242a32"/>
  <circle cx="78" cy="60" r="5" fill="#ef8a35"/>
  <text x="92" y="66" class="subtitle" fill="#c9cfd6">待判断的信息</text>
  <text x="228" y="62" class="title">是否应该写进最终交付？</text>
  <text x="228" y="88" class="subtitle">从上到下判断，命中「保留」或「省略」即停止</text>

  <path d="M78 150V475" fill="none" stroke="#4b3828" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 11"/>

  <g filter="url(#shadow)">
    <rect class="card card-active" x="104" y="122" width="1036" height="112" rx="18"/>
    <circle cx="78" cy="178" r="25" fill="#ef8a35"/>
    <text x="78" y="184" class="step">01</text>
    <text x="145" y="169" class="question">脱离工作会话后，读者仍然需要吗？</text>
    <text x="145" y="199" class="hint">先判断它对成品读者是否真的有用</text>
    <rect x="834" y="151" width="132" height="54" rx="27" fill="#2a3038" stroke="#454d58"/>
    <text x="900" y="184" class="chip chip-omit">否 · 省略</text>
    <rect x="982" y="151" width="132" height="54" rx="27" fill="#2b211a" stroke="#ef8a35"/>
    <text x="1048" y="184" class="chip chip-continue">是 · 继续</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="104" y="270" width="1036" height="112" rx="18"/>
    <circle cx="78" cy="326" r="25" fill="#f5f0e8"/>
    <text x="78" y="332" class="step">02</text>
    <text x="145" y="317" class="question">省略会造成实质问题，或它属于真实基线变化吗？</text>
    <text x="145" y="347" class="hint">安全、准确性、兼容性、合规，以及真实发生的删除或迁移</text>
    <rect x="834" y="299" width="132" height="54" rx="27" fill="#ef8a35"/>
    <text x="900" y="332" class="chip chip-keep">是 · 保留</text>
    <rect x="982" y="299" width="132" height="54" rx="27" fill="#2b211a" stroke="#ef8a35"/>
    <text x="1048" y="332" class="chip chip-continue">否 · 继续</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="104" y="418" width="1036" height="112" rx="18"/>
    <circle cx="78" cy="474" r="25" fill="#f5f0e8"/>
    <text x="78" y="480" class="step">03</text>
    <text x="145" y="465" class="question">用户明确要求说明吗？</text>
    <text x="145" y="495" class="hint">例如方案比较、审计、逐字引用、发布记录或迁移说明</text>
    <rect x="834" y="447" width="132" height="54" rx="27" fill="#ef8a35"/>
    <text x="900" y="480" class="chip chip-keep">是 · 保留</text>
    <rect x="982" y="447" width="132" height="54" rx="27" fill="#2a3038" stroke="#454d58"/>
    <text x="1048" y="480" class="chip chip-omit">否 · 省略</text>
  </g>

  <circle cx="78" cy="563" r="5" fill="#ef8a35"/>
  <text x="94" y="568" class="footer">保留最终读者需要的事实，不记录只存在于工作会话的试错过程。</text>
</svg>
