<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Decision boundary for final deliverables</title>
  <desc id="desc">A three-step decision: whether readers still need the information, whether omission causes material harm or hides a real baseline change, and whether the user explicitly requested it.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <style>
      .bg { fill: #101318; }
      .frame { fill: none; stroke: #303640; stroke-width: 1.5; }
      .card { fill: #191d23; stroke: #343a44; stroke-width: 1.5; }
      .card-active { stroke: #5a4430; }
      .title { fill: #f5f0e8; font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #8f98a5; font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .question { fill: #f5f0e8; font: 650 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .hint { fill: #8f98a5; font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .step { fill: #101318; font: 800 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .chip { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .chip-keep { fill: #101318; }
      .chip-continue { fill: #ef8a35; }
      .chip-omit { fill: #a4acb7; }
      .footer { fill: #737d89; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="620" rx="28"/>
  <rect class="frame" x="18" y="18" width="1164" height="584" rx="22"/>

  <rect x="58" y="43" width="214" height="34" rx="17" fill="#242a32"/>
  <circle cx="78" cy="60" r="5" fill="#ef8a35"/>
  <text x="92" y="66" class="subtitle" fill="#c9cfd6">INFORMATION TO REVIEW</text>
  <text x="298" y="62" class="title">Should this appear in the final deliverable?</text>
  <text x="298" y="88" class="subtitle">Evaluate from top to bottom; stop when the outcome is KEEP or OMIT</text>

  <path d="M78 150V475" fill="none" stroke="#4b3828" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 11"/>

  <g filter="url(#shadow)">
    <rect class="card card-active" x="104" y="122" width="1036" height="112" rx="18"/>
    <circle cx="78" cy="178" r="25" fill="#ef8a35"/>
    <text x="78" y="184" class="step">01</text>
    <text x="145" y="169" class="question">Would a reader still need this without the working session?</text>
    <text x="145" y="199" class="hint">First decide whether the information is useful to the reader of the finished artifact.</text>
    <rect x="834" y="151" width="132" height="54" rx="27" fill="#2a3038" stroke="#454d58"/>
    <text x="900" y="184" class="chip chip-omit">NO · OMIT</text>
    <rect x="982" y="151" width="132" height="54" rx="27" fill="#2b211a" stroke="#ef8a35"/>
    <text x="1048" y="184" class="chip chip-continue">YES · NEXT</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="104" y="270" width="1036" height="112" rx="18"/>
    <circle cx="78" cy="326" r="25" fill="#f5f0e8"/>
    <text x="78" y="332" class="step">02</text>
    <text x="145" y="317" class="question">Would omission cause harm, or hide a real baseline change?</text>
    <text x="145" y="347" class="hint">Safety, accuracy, compatibility, compliance, and removals or migrations that actually happened.</text>
    <rect x="834" y="299" width="132" height="54" rx="27" fill="#ef8a35"/>
    <text x="900" y="332" class="chip chip-keep">YES · KEEP</text>
    <rect x="982" y="299" width="132" height="54" rx="27" fill="#2b211a" stroke="#ef8a35"/>
    <text x="1048" y="332" class="chip chip-continue">NO · NEXT</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="104" y="418" width="1036" height="112" rx="18"/>
    <circle cx="78" cy="474" r="25" fill="#f5f0e8"/>
    <text x="78" y="480" class="step">03</text>
    <text x="145" y="465" class="question">Did the user explicitly request this information?</text>
    <text x="145" y="495" class="hint">For example: comparisons, audits, quotations, changelogs, or migration notes.</text>
    <rect x="834" y="447" width="132" height="54" rx="27" fill="#ef8a35"/>
    <text x="900" y="480" class="chip chip-keep">YES · KEEP</text>
    <rect x="982" y="447" width="132" height="54" rx="27" fill="#2a3038" stroke="#454d58"/>
    <text x="1048" y="480" class="chip chip-omit">NO · OMIT</text>
  </g>

  <circle cx="78" cy="563" r="5" fill="#ef8a35"/>
  <text x="94" y="568" class="footer">Keep facts the final reader needs. Omit experiments and corrections that existed only in the working session.</text>
</svg>
