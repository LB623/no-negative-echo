name: update star history

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/star-history.yml
      - scripts/update_star_history.py
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render star history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_star_history.py --output /tmp/star-history.svg
      - name: Publish chart without repository commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view star-history >/dev/null 2>&1; then
            gh release create star-history \
              --target "$GITHUB_SHA" \
              --title "Star history assets" \
              --notes "Automatically updated README assets. This prerelease is not a project version." \
              --prerelease
          fi
          gh release upload star-history /tmp/star-history.svg --clobber
